<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:1000px;overflow:hidden;background:#030712}
body{position:relative;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#fff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%;filter:saturate(1.25) contrast(1.08) brightness(.72);transform:scale(1.04)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,7,18,.08),rgba(3,7,18,.48) 52%,rgba(3,7,18,.96)),linear-gradient(0deg,rgba(3,7,18,.78),transparent 52%)}
.ring{position:absolute;left:92px;top:110px;width:860px;height:640px;border:8px solid #67e8f9;border-radius:50%;filter:drop-shadow(0 0 22px #22d3ee);transform:rotate(-8deg)}
.copy{position:absolute;right:72px;top:130px;width:700px;text-align:right}
.tag{display:inline-block;padding:14px 24px;border:2px solid #67e8f9;border-radius:99px;background:#06172bd9;color:#67e8f9;font-size:30px;font-weight:900}
h1{margin:30px 0 22px;font-size:112px;line-height:.98;letter-spacing:-.06em;text-shadow:0 8px 35px #000}
h1 span{display:block;color:#facc15}
.sub{font-size:38px;font-weight:900;color:#e2e8f0;letter-spacing:.08em}
.save{display:inline-block;margin-top:34px;padding:11px 20px;border:1px solid #facc15aa;border-radius:99px;background:#241c05cc;color:#facc15;font-size:24px;font-weight:900}
</style>
</head>
<body>
  <img class="bg" src="../../source/extra/MOD介绍/masa/minihud/assets/screenshots/shape.webp" alt="">
  <div class="shade"></div><div class="ring"></div>
  <div class="copy">
    <span class="tag">MiniHUD</span>
    <h1><span>别再靠目测</span></h1>
    <div class="sub">结构 · 范围 · 施工</div>
    <div class="save">收藏这份清单</div>
  </div>
</body>
</html>
