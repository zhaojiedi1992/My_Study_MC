<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mod Menu B 站封面 4:3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1200px;overflow:hidden;background:#070b12;color:#fff}
body{position:relative;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;border:8px solid #172434}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,#6cc9ff40,transparent 35%),radial-gradient(circle at 14% 90%,#9ee26b36,transparent 34%),linear-gradient(135deg,#070b12,#0d1826)}
.grid{position:absolute;inset:0;opacity:.17;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);background-size:44px 44px}
.brand{position:absolute;left:74px;top:63px;z-index:5;display:flex;align-items:center;gap:14px;padding:13px 23px;border:2px solid #9ee26b;border-radius:99px;background:#10231ce8;color:#cfffad;font-size:29px;font-weight:950;letter-spacing:.04em}
.brand i{width:18px;height:18px;background:#9ee26b;box-shadow:10px 0 #6cc9ff,0 10px #6cc9ff,10px 10px #9ee26b;transform:translateY(-5px)}
h1{position:absolute;left:72px;top:155px;z-index:5;width:900px;font-size:154px;line-height:.88;letter-spacing:-.08em;font-weight:1000;text-shadow:0 12px 40px #000}
h1 span{display:block}h1 span:last-child{margin-top:20px;color:#ffc85c}
.answer{position:absolute;left:76px;top:487px;z-index:6;padding:15px 23px;border-left:9px solid #9ee26b;border-radius:0 15px 15px 0;background:#14251df2;color:#fff;font-size:43px;font-weight:1000;box-shadow:0 14px 32px #0008}
.shot{position:absolute;right:54px;bottom:77px;z-index:3;width:920px;height:620px;overflow:hidden;border:7px solid #6cc9ff;border-radius:30px;background:#03070c;box-shadow:0 35px 90px #000c,0 0 42px #6cc9ff44;transform:rotate(1deg)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:17% 50%;transform:scale(1.22)}
.shot::after{content:"模组列表，一眼找到";position:absolute;right:24px;bottom:23px;padding:12px 18px;border-radius:12px;background:#06101be8;color:#dff6ff;font-size:27px;font-weight:900}
.pain{position:absolute;left:76px;bottom:94px;z-index:6;display:grid;gap:15px}
.pain span{width:max-content;padding:13px 18px;border:1px solid #ffffff55;border-radius:12px;background:#09111dec;color:#e8eef5;font-size:27px;font-weight:900;box-shadow:0 10px 25px #0007}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="brand"><i></i> MINECRAFT · 模组管理</div>
  <h1><span>设置</span><span>藏哪了？</span></h1>
  <div class="answer">Mod Menu 带你找门</div>
  <figure class="shot"><img src="../../source/extra/MOD介绍/modmenu/assets/screenshots/mod-menu-list.png" alt="Mod Menu 模组列表"></figure>
  <div class="pain"><span>不用翻 JAR</span><span>不用退游戏</span></div>
</body>
</html>
