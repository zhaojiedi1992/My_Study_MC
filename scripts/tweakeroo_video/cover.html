<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tweakeroo B 站封面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:1000px;overflow:hidden;background:#06101b;color:#fff}
body{position:relative;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;border:6px solid #0d2638}
.gamma{position:absolute;inset:0 0 0 520px;width:1080px;height:1000px;object-fit:cover;object-position:48% 50%;filter:saturate(1.08) contrast(1.05)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#04101c 0%,#061522f7 28%,#061522d9 48%,#06152252 72%,#06152210 100%)}
.glow{position:absolute;left:-120px;bottom:-260px;width:820px;height:600px;border-radius:50%;background:#0d94885e;filter:blur(80px)}
.copy{position:absolute;left:86px;top:96px;width:760px;z-index:3}
.brand{display:inline-flex;align-items:center;padding:13px 24px;border:2px solid #5eead4;border-radius:99px;background:#042a30e8;color:#71f5df;font-size:30px;font-weight:900;letter-spacing:.03em;box-shadow:0 0 28px #14b8a644}
h1{margin-top:42px;font-size:142px;line-height:.88;letter-spacing:-.075em;font-weight:1000;text-shadow:0 10px 36px #000}
h1 span{display:block}h1 span:last-child{margin-top:18px;color:#facc15}
.promise{margin-top:38px;color:#ecfeff;font-size:34px;font-weight:850;letter-spacing:.02em;text-shadow:0 4px 18px #000}
.chips{position:absolute;left:88px;bottom:92px;z-index:4;display:flex;gap:15px}
.chips span{padding:14px 20px;border:1px solid #ffffff66;border-radius:13px;background:#04111ee8;color:#f8fafc;font-size:26px;font-weight:900;box-shadow:0 8px 22px #0007}
.soul-card{position:absolute;right:76px;top:92px;width:470px;height:500px;overflow:hidden;border:5px solid #67e8f9;border-radius:28px;background:#020711;box-shadow:0 24px 60px #000b,0 0 35px #22d3ee55;transform:rotate(1.5deg);z-index:2}
.soul-card img{width:100%;height:100%;object-fit:cover;object-position:50% 48%;transform:scale(2.25)}
.soul-card b{position:absolute;left:22px;top:20px;padding:9px 16px;border-radius:99px;background:#042f37e8;color:#67e8f9;font-size:24px;letter-spacing:.04em}
.soul-card i{position:absolute;right:22px;bottom:20px;padding:8px 14px;border-radius:10px;background:#020617d9;color:#fff;font-size:22px;font-style:normal;font-weight:900}
.corner{position:absolute;right:58px;bottom:56px;z-index:4;color:#d8fbff;font-size:22px;font-weight:850;letter-spacing:.08em;text-shadow:0 3px 12px #000}
</style>
</head>
<body>
  <img class="gamma" src="../../source/extra/MOD介绍/masa/tweakeroo/启用ganam的.png" alt="Gamma 开启后的明亮游戏画面">
  <div class="shade"></div><div class="glow"></div>
  <main class="copy">
    <div class="brand">Tweakeroo · 5 个高频功能</div>
    <h1><span>别再</span><span>手动了！</span></h1>
    <p class="promise">把重复操作，交给客户端</p>
  </main>
  <div class="chips"><span>自动补货</span><span>快速换甲</span><span>矿洞提亮</span></div>
  <figure class="soul-card">
    <img src="../../source/extra/MOD介绍/masa/tweakeroo/开启灵魂出窍.png" alt="灵魂出窍时本体留在原地">
    <b>灵魂出窍</b><i>本体留在原地</i>
  </figure>
  <div class="corner">MINECRAFT JAVA · CLIENT MOD</div>
</body>
</html>
