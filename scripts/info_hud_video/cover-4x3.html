<!doctype html>

  <style>
    *{box-sizing:border-box}html,body{width:1600px;height:1287px;margin:0;overflow:hidden;background:#071018;font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.cover{position:relative;width:1600px;height:1287px;overflow:hidden;background:#061019}.game{position:absolute;inset:0;background:linear-gradient(90deg,#061019f6 0%,#061019e8 52%,#061019a2 100%),url("../../build/info-hud-video/cover-source/cover-game.jpg") center/cover no-repeat;filter:saturate(1.08) contrast(1.06);transform:scale(1.05)}.shade{position:absolute;inset:0;background:radial-gradient(circle at 77% 76%,#67def226,transparent 32%),radial-gradient(circle at 8% 8%,#a9e85722,transparent 29%)}.grid{position:absolute;inset:0;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(90deg,#000,transparent 72%)}.tag{position:absolute;right:86px;top:62px;padding:12px 18px;border:1px solid #ffffff2e;border-radius:10px;background:#071018dc;color:#d5e7ee;font:900 21px/1 ui-monospace,Consolas,monospace;letter-spacing:2px}.content{position:absolute;left:92px;top:76px;width:1040px;color:#f7fbff}.eyebrow{display:inline-flex;align-items:center;gap:12px;padding:10px 17px;border:2px solid #a9e857;border-radius:99px;background:#a9e85716;color:#ddffb8;font-size:28px;font-weight:1000;letter-spacing:2px}.eyebrow::before{content:"";width:15px;height:15px;border-radius:50%;background:#a9e857;box-shadow:0 0 24px #a9e857}.title{margin:27px 0 0;font-size:112px;font-weight:1000;line-height:.9;letter-spacing:-9px;text-shadow:0 9px 0 #0008}.title .lime{color:#b8f26a}.sub{margin:26px 0 0;color:#d8e8ef;font-size:31px;font-weight:900;line-height:1.38;letter-spacing:1px}.sub b{color:#fff}.rule{width:300px;height:8px;margin-top:28px;border-radius:99px;background:linear-gradient(90deg,#b8f26a,#4dd5ef);box-shadow:0 0 22px #67def277}.proofs{position:absolute;top:515px;left:80px;right:80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:27px 28px}.proof{position:relative;height:310px;overflow:hidden;border:3px solid #ffffff32;border-radius:24px;background:#0a1722;box-shadow:0 20px 42px #0009}.proof img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.1) contrast(1.06);transform:scale(1.025)}.proof::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#06101908 40%,#061019e9 100%)}.proof .label{position:absolute;z-index:3;left:21px;bottom:19px;color:#fff;font-size:40px;font-weight:1000;line-height:1;letter-spacing:-2px;text-shadow:0 2px 5px #000}.proof .mini{position:absolute;z-index:3;left:20px;top:19px;padding:9px 12px;border:1px solid #ffffff42;border-radius:9px;background:#071018da;color:#dbeef4;font:900 16px/1 ui-monospace,Consolas,monospace;letter-spacing:1px}.proof.dur{border-color:#60e5f5c9;box-shadow:0 0 0 4px #67def235,0 22px 44px #0009}.proof.neat{border-color:#a9e857a3}.proof.apple{border-color:#ffcc6aa3}.proof.jade{border-color:#c9a4ffa3}.lens{position:absolute;z-index:5;right:23px;bottom:20px;display:grid;place-items:center;width:145px;height:145px;border:9px solid #eaffff;border-radius:50%;background:linear-gradient(145deg,#072433ed,#071018ef);box-shadow:0 0 0 6px #67def244,0 15px 30px #000a;transform:rotate(-11deg)}.lens::after{content:"";position:absolute;right:-62px;bottom:-30px;width:76px;height:21px;border-radius:99px;background:#eaffff;box-shadow:0 0 0 5px #67def244;transform:rotate(44deg)}.lens strong{color:#eaffff;font:1000 43px/1 ui-monospace,Consolas,monospace;letter-spacing:-5px;text-shadow:0 0 16px #67def2}.lens span{margin-top:4px;color:#9eeeff;font-size:13px;font-weight:1000;letter-spacing:1px}.apple img{transform:none;object-position:52% 100%}.apple::after{background:linear-gradient(180deg,#06101905 19%,#061019cf 100%)}.hud-focus,.neat-focus,.jade-focus{position:absolute;z-index:2;border:4px solid;border-radius:12px}.hud-focus{left:332px;bottom:31px;width:266px;height:82px;border-color:#ff     </section>
  </main>
