<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Scroller 动画演示 Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0a0a0f;
  color: #fff;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 60px;
}

.demo-section {
  width: 100%;
  max-width: 800px;
  padding: 40px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
}

.demo-title {
  font-size: 2rem;
  font-weight: 900;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #fff, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.demo-desc {
  font-size: 0.95rem;
  color: rgba(255,255,255,0.7);
  margin-bottom: 30px;
}

/* ═══════════════════════════════════════════
   1. 滚轮批量移动动画
   ═══════════════════════════════════════════ */
.scroll-demo {
  display: flex;
  gap: 40px;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 40px 20px;
}

.inventory {
  display: grid;
  grid-template-columns: repeat(9, 36px);
  gap: 2px;
  padding: 8px;
  background: rgba(139, 139, 139, 0.3);
  border: 2px solid rgba(139, 139, 139, 0.6);
  border-radius: 4px;
  image-rendering: pixelated;
}

.inv-slot {
  width: 36px;
  height: 36px;
  background: rgba(139, 139, 139, 0.5);
  border: 1px solid rgba(0,0,0,0.5);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.inv-slot.highlight {
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8) inset;
}

.item {
  width: 24px;
  height: 24px;
  background: #D4A574;
  border: 2px solid #8B6F47;
  image-rendering: pixelated;
  position: relative;
}

.item.diamond {
  background: linear-gradient(135deg, #5DFFFF 0%, #00A8A8 100%);
  border-color: #007A7A;
}

.item.stone {
  background: linear-gradient(135deg, #8C8C8C 0%, #606060 100%);
  border-color: #404040;
}

/* 物品数量角标 */
.item-count {
  position: absolute;
  bottom: -2px;
  right: -2px;
  font-size: 10px;
  font-weight: 900;
  color: #fff;
  text-shadow: 1px 1px 0 #000;
  font-family: 'Courier New', monospace;
}

/* 飞行动画 */
@keyframes fly-to-inventory {
  0% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  50% {
    transform: translate(200px, -20px) scale(0.8);
    opacity: 0.8;
  }
  100% {
    transform: translate(400px, 0) scale(0.6);
    opacity: 0;
  }
}

.item.flying {
  position: absolute;
  animation: fly-to-inventory 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
}

/* 鼠标滚轮指示器 */
.mouse-indicator {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  animation: mouse-pulse 3s ease-in-out infinite;
}

@keyframes mouse-pulse {
  0%, 100% { opacity: 0; }
  10%, 90% { opacity: 1; }
}

.mouse-icon {
  width: 28px;
  height: 40px;
  border: 2px solid rgba(255,255,255,0.6);
  border-radius: 12px;
  position: relative;
}

.mouse-wheel {
  width: 4px;
  height: 8px;
  background: rgba(255,255,255,0.8);
  position: absolute;
  left: 50%;
  top: 8px;
  transform: translateX(-50%);
  animation: wheel-scroll 1.5s ease-in-out infinite;
}

@keyframes wheel-scroll {
  0%, 100% { top: 8px; opacity: 1; }
  50% { top: 20px; opacity: 0.3; }
}

.mouse-label {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  font-weight: 600;
}

/* ═══════════════════════════════════════════
   2. 拖拽扫描动画
   ═══════════════════════════════════════════ */
.drag-demo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 40px 20px;
  position: relative;
}

.chest-grid {
  display: grid;
  grid-template-columns: repeat(9, 36px);
  grid-template-rows: repeat(3, 36px);
  gap: 2px;
  padding: 8px;
  background: rgba(139, 139, 139, 0.3);
  border: 2px solid rgba(139, 139, 139, 0.6);
  border-radius: 4px;
  position: relative;
}

/* 拖拽路径 */
.drag-trail {
  position: absolute;
  width: 4px;
  height: 4px;
  background: rgba(96, 165, 250, 0.8);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
}

/* 逐个格子高亮消失 */
@keyframes slot-clear {
  0% {
    background: rgba(139, 139, 139, 0.5);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8) inset;
  }
  50% {
    background: rgba(96, 165, 250, 0.3);
    box-shadow: 0 0 0 2px rgba(96, 165, 250, 1) inset;
  }
  100% {
    background: rgba(139, 139, 139, 0.5);
    box-shadow: none;
  }
}

.inv-slot.clearing .item {
  animation: item-disappear 0.4s ease-out forwards;
}

@keyframes item-disappear {
  0% {
    transform: scale(1);
    opacity: 1;
  }
  100% {
    transform: scale(0.3);
    opacity: 0;
  }
}

/* 拖拽鼠标光标 */
.drag-cursor {
  position: absolute;
  width: 20px;
  height: 28px;
  background: rgba(255, 255, 255, 0.9);
  clip-path: polygon(0 0, 0 100%, 30% 70%, 50% 100%, 60% 95%, 40% 65%, 70% 60%);
  pointer-events: none;
  z-index: 10;
  animation: drag-path 4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}

@keyframes drag-path {
  0% {
    left: 10px;
    top: 10px;
  }
  25% {
    left: 280px;
    top: 10px;
  }
  50% {
    left: 280px;
    top: 80px;
  }
  75% {
    left: 10px;
    top: 80px;
  }
  100% {
    left: 10px;
    top: 10px;
  }
}

/* ═══════════════════════════════════════════
   3. 配方批量合成动画
   ═══════════════════════════════════════════ */
.craft-demo {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 40px;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.craft-input, .craft-output {
  display: grid;
  grid-template-columns: repeat(3, 36px);
  gap: 2px;
  padding: 8px;
  background: rgba(139, 139, 139, 0.3);
  border: 2px solid rgba(139, 139, 139, 0.6);
  border-radius: 4px;
}

.craft-arrow {
  font-size: 32px;
  color: rgba(255, 255, 255, 0.6);
  animation: arrow-pulse 1.5s ease-in-out infinite;
}

@keyframes arrow-pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 0.6;
  }
  50% {
    transform: scale(1.2);
    opacity: 1;
  }
}

/* 材料消耗动画 */
.craft-input .inv-slot .item-count {
  animation: count-decrease 3s steps(8) infinite;
}

@keyframes count-decrease {
  0% { content: '64'; }
  12.5% { content: '56'; }
  25% { content: '48'; }
  37.5% { content: '40'; }
  50% { content: '32'; }
  62.5% { content: '24'; }
  75% { content: '16'; }
  87.5% { content: '8'; }
  100% { content: '0'; }
}

/* 成品堆叠动画 */
.craft-output .item {
  animation: item-stack 3s ease-in-out infinite;
}

@keyframes item-stack {
  0%, 10% {
    transform: scale(0);
    opacity: 0;
  }
  15% {
    transform: scale(1.3);
    opacity: 1;
  }
  20%, 100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* 按键提示 */
.keybind-hint {
  text-align: center;
  margin-top: 20px;
  padding: 12px 20px;
  background: rgba(96, 165, 250, 0.1);
  border: 1px solid rgba(96, 165, 250, 0.3);
  border-radius: 8px;
  font-size: 14px;
  color: rgba(255, 255, 255, 0.85);
  font-weight: 600;
}

kbd {
  display: inline-block;
  background: rgba(255, 255, 255, 0.15);
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  border-radius: 4px;
  padding: 2px 8px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  font-weight: 900;
  color: #fff;
  margin: 0 2px;
}
</style>
</head>
<body>

<!-- Demo 1: 滚轮批量移动 -->
<div class="demo-section">
  <h2 class="demo-title">🖱️ 滚轮批量移动</h2>
  <p class="demo-desc">悬停物品格 → 滚动鼠标滚轮 → 物品自动从箱子飞到背包</p>

  <div class="scroll-demo">
    <!-- 左侧箱子 -->
    <div class="inventory">
      <div class="inv-slot highlight">
        <div class="item diamond">
          <span class="item-count">64</span>
        </div>
      </div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
    </div>

    <!-- 鼠标滚轮指示器 -->
    <div class="mouse-indicator">
      <div class="mouse-icon">
        <div class="mouse-wheel"></div>
      </div>
      <span class="mouse-label">向上滚</span>
    </div>

    <!-- 飞行中的物品 -->
    <div class="item diamond flying" style="left: 100px; top: 50%;"></div>

    <!-- 右侧背包 -->
    <div class="inventory">
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
    </div>
  </div>

  <div class="keybind-hint">
    <kbd>Shift</kbd> + 滚动 = 整堆移动 (64个)
  </div>
</div>

<!-- Demo 2: 拖拽扫描 -->
<div class="demo-section">
  <h2 class="demo-title">✋ 拖拽扫描批量处理</h2>
  <p class="demo-desc">按住 <kbd>Shift</kbd> + 拖拽鼠标，路径上的每个格子都被自动清空</p>

  <div class="drag-demo">
    <div class="chest-grid">
      <!-- 拖拽光标 -->
      <div class="drag-cursor"></div>

      <!-- 3x9 箱子格子 -->
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>

      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item diamond"></div></div>
      <div class="inv-slot"><div class="item diamond"></div></div>
      <div class="inv-slot"><div class="item diamond"></div></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>
      <div class="inv-slot"></div>

      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
      <div class="inv-slot"><div class="item stone"></div></div>
    </div>
  </div>

  <div class="keybind-hint">
    <kbd>Shift</kbd> + 左键拖拽 = 每格整堆移走
  </div>
</div>

<!-- Demo 3: 批量合成 -->
<div class="demo-section">
  <h2 class="demo-title">⚡ 配方批量合成量产</h2>
  <p class="demo-desc">按住 <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>C</kbd> 自动循环合成，直到材料耗尽</p>

  <div class="craft-demo">
    <!-- 输入材料 -->
    <div class="craft-input">
      <div class="inv-slot">

    <!-- 箭头 -->
    <div class="craft-arrow">➜</div>

      <div class="inv-slot">

      <div class="inv-slot">

  <div class="keybind-hint">

</body>
</html>
