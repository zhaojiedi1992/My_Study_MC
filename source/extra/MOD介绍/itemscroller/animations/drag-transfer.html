<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>拖拽横扫整行 - Item Scroller 动画</title>
<style>
:root{--bg:#111214;--surface:#1b1d20;--line:#393d42;--text:#f4f4f5;--muted:#a9adb3;--accent:#b98af0;--slot:clamp(27px,5.4vw,43px)}*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.page{width:min(1040px,calc(100% - 24px));margin:auto;padding:20px 0 34px}.topbar,.heading,.pager{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{margin-bottom:28px}.back,.pager a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.back:hover,.pager a:hover{color:#fff}.file{color:#80868e;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}.heading{align-items:end;margin-bottom:17px}.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:126px;padding:0 16px;border:1px solid #d2b2f7;border-radius:5px;background:var(--accent);color:#20152c;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:570px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px 12px;background:#0c0d0f;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3c3c3c}.title{height:21px;margin-left:2px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.title.player{margin-top:11px}.grid{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}.slot.scan{background:#a4a4a4;box-shadow:inset 0 0 0 2px var(--accent)}.slot.arrived{animation:arrive .26s ease}.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.7vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111}.cursor{position:absolute;width:24px;height:32px;z-index:30;background:#fff;clip-path:polygon(0 0,0 85%,25% 65%,42% 100%,58% 92%,42% 59%,75% 58%);filter:drop-shadow(2px 2px 0 #111);opacity:0;transition:left .19s linear,top .19s linear}.cursor.show{opacity:1}.trail{position:absolute;height:3px;background:var(--accent);transform-origin:left center;z-index:15;opacity:.65;box-shadow:0 0 7px #b98af077}.flying{position:absolute;z-index:20;transition:left .18s ease-in,top .18s ease-in,transform .18s ease-in;filter:drop-shadow(2px 3px #0008)}
.keys{position:absolute;left:20px;top:20px;display:flex;align-items:center;gap:8px;color:#abb0b5;font-size:12px}.key{min-width:52px;padding:7px 9px;text-align:center;color:#fff;background:#282b2f;border:1px solid #5c6269;border-bottom-width:3px;border-radius:4px;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}.key.held{border-color:var(--accent);background:#392a4a;color:#ead9ff;transform:translateY(2px);border-bottom-width:1px}
@keyframes arrive{0%{box-shadow:inset 0 0 0 2px #fff,0 0 12px var(--accent)}100%{box-shadow:none}}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#cdd0d4;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#687078}.status.running::before,.status.done::before{background:var(--accent)}.status.running::before{box-shadow:0 0 0 4px #b98af020}.pager{padding-top:17px;border-top:1px solid #2c3034}.pager a:last-child{color:var(--accent)}
@media(max-width:720px){.heading{align-items:start;flex-direction:column}.demo{min-height:535px;padding:64px 6px 18px}.readout{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.file{max-width:130px;text-align:right;word-break:break-all}.keys{left:12px;top:14px}.cursor{width:20px;height:27px}}
@media(prefers-reduced-motion:reduce){.cursor,.flying{transition:none}.slot.arrived{animation:none}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">drag-transfer.html</span></nav>
  <header class="heading"><div><p class="eyebrow">02 / SHIFT DRAG</p><h1>拖拽横扫整行</h1><p class="summary">按住 Shift 拖过容器槽位，路径上的整堆物品依次转入玩家物品栏。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>
  <section class="demo" id="stage" aria-label="点击播放拖拽转移动画">
    <div class="keys"><span class="key" id="shift-key">SHIFT</span><span>+</span><span class="key" id="mouse-key">LMB</span></div>
    <div class="mc-window" id="window">
      <div class="title">大型箱子</div>
      <div class="grid" id="chest">
        <div class="slot source" data-item-name="cobble"><div class="item" data-item="cobble"></div><span class="count">64</span></div><div class="slot source" data-item-name="cobble"><div class="item" data-item="cobble"></div><span class="count">64</span></div><div class="slot source" data-item-name="log"><div class="item" data-item="log"></div><span class="count">64</span></div><div class="slot source" data-item-name="wheat"><div class="item" data-item="wheat"></div><span class="count">64</span></div><div class="slot source" data-item-name="cobble"><div class="item" data-item="cobble"></div><span class="count">64</span></div><div class="slot source" data-item-name="log"><div class="item" data-item="log"></div><span class="count">64</span></div><div class="slot source" data-item-name="wheat"><div class="item" data-item="wheat"></div><span class="count">64</span></div><div class="slot source" data-item-name="cobble"><div class="item" data-item="cobble"></div><span class="count">64</span></div><div class="slot source" data-item-name="log"><div class="item" data-item="log"></div><span class="count">64</span></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"><div class="item" data-item="iron"></div><span class="count">6</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
      <div class="title player">物品栏</div>
      <div class="grid" id="inventory">
        <div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div><div class="slot target"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
      <div style="height:7px"></div><div class="grid"><div class="slot"><div class="item" data-item="torch"></div><span class="count">31</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
    </div>
    <div class="cursor" id="cursor"></div><div class="trail" id="trail"></div>
  </section>
  <div class="readout"><div class="metric"><b>9 堆</b><span>一次拖拽路径</span></div><div class="metric"><b>576 个</b><span>实际转移数量</span></div><div class="metric"><b>连续扫描</b><span>高速拖动不漏格</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="scroll-transfer.html">&#8592; 滚轮逐个转移</a><a href="bulk-discard.html">批量丢弃与保护 &#8594;</a></nav>
</main>
<script>
const SPRITES={
  cobble:{p:{a:'#aaa',b:'#888',c:'#686868',d:'#505050'},g:['aabbccaa','bccabbba','cadccbbc','bccaaacd','adccbbca','cbaadcbb','acbbccaa','bcaabbcc']},
  log:{p:{a:'#a87843',b:'#80582f',c:'#61401f',d:'#3e2815'},g:['abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc']},
  wheat:{p:{a:'#f1db6d',b:'#cfad42',c:'#9e7929',d:'#674d18'},g:['........','.a.b.a..','.ab.ba..','.bc.cb..','..bccb..','..cdc...','...d....','........']},
  iron:{p:{a:'#f1f1ec',b:'#c8c9c4',c:'#999b98',d:'#707270'},g:['........','..aaaa..','.abbbba.','abccccba','abccccba','.bcddcb.','..cddc..','........']},
  torch:{p:{a:'#fff18a',b:'#f0b840',c:'#9b6a30',d:'#69401f'},g:['...aa...','..abba..','...bb...','...cc...','...cc...','...cd...','...dd...','........']}
};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}const CACHE={};function paint(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}paint();
const stage=document.getElementById('stage'),sources=[...document.querySelectorAll('.source')],targets=[...document.querySelectorAll('.target')],cursor=document.getElementById('cursor'),trail=document.getElementById('trail'),shiftKey=document.getElementById('shift-key'),mouseKey=document.getElementById('mouse-key'),status=document.getElementById('status'),playButton=document.getElementById('play');const initial=sources.map(s=>s.innerHTML);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function center(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();return{x:b.left-a.left+b.width/2,y:b.top-a.top+b.height/2}}
function move(el){const p=center(el);cursor.style.left=(p.x+2)+'px';cursor.style.top=(p.y+1)+'px'}
function reset(){sources.forEach((s,i)=>{s.innerHTML=initial[i];s.classList.remove('scan')});targets.forEach(t=>{t.innerHTML='';t.classList.remove('arrived')});paint();cursor.classList.remove('show');trail.style.width='0';shiftKey.classList.remove('held');mouseKey.classList.remove('held');status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.firstElementChild.textContent='\u25b6';playButton.lastElementChild.textContent='播放动画';finished=false}
async function transfer(source,target,name){const a=stage.getBoundingClientRect(),s=source.getBoundingClientRect(),t=target.getBoundingClientRect(),el=document.createElement('div');el.className='item flying';el.style.backgroundImage=`url(${CACHE[name]})`;el.style.width=(s.width*.72)+'px';el.style.height=(s.height*.72)+'px';el.style.left=(s.left-a.left+s.width*.14)+'px';el.style.top=(s.top-a.top+s.height*.14)+'px';stage.appendChild(el);source.innerHTML='';await wait(20);el.style.left=(t.left-a.left+t.width*.14)+'px';el.style.top=(t.top-a.top+t.height*.14)+'px';el.style.transform='scale(.8)';await wait(190);target.innerHTML=`<div class="item" data-item="${name}"></div><span class="count">64</span>`;paint(target);target.classList.add('arrived');el.remove()}
async function play(){if(playing)return;if(finished)reset();playing=true;status.className='status running';status.textContent='Shift + 左键保持按下，正在扫描第 1 行';playButton.lastElementChild.textContent='播放中';shiftKey.classList.add('held');mouseKey.classList.add('held');move(sources[0]);cursor.classList.add('show');const first=center(sources[0]),last=center(sources.at(-1));trail.style.left=first.x+'px';trail.style.top=first.y+'px';trail.style.width='0';trail.style.transform=`rotate(${Math.atan2(last.y-first.y,last.x-first.x)}rad)`;await wait(260);for(let i=0;i<sources.length;i++){move(sources[i]);trail.style.width=((last.x-first.x)*(i/(sources.length-1)))+'px';sources[i].classList.add('scan');status.textContent=`正在扫描槽位 ${i+1} / ${sources.length}`;await wait(190);await transfer(sources[i],targets[i],sources[i].dataset.itemName);sources[i].classList.remove('scan')}cursor.classList.remove('show');shiftKey.classList.remove('held');mouseKey.classList.remove('held');status.className='status done';status.textContent='完成：一条拖拽路径转移了 9 个整堆';playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);addEventListener('resize',()=>{if(cursor.classList.contains('show'))move(sources.find(s=>s.classList.contains('scan'))||sources[0])});
if(new URLSearchParams(location.search).get('autoplay')==='1')setTimeout(play,450);
</script>
</body>
</html>
