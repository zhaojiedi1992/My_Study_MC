<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>批量丢弃与保护 - Item Scroller 动画</title>
<style>
:root{--bg:#121211;--surface:#1d1d1b;--line:#403c37;--text:#f5f3ef;--muted:#b0aaa2;--accent:#ee9363;--safe:#69d6bd;--slot:clamp(27px,5.7vw,44px)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.page{width:min(1040px,calc(100% - 24px));margin:auto;padding:20px 0 34px}.topbar,.heading,.pager{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{margin-bottom:28px}.back,.pager a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.back:hover,.pager a:hover{color:#fff}.file{color:#89847e;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}.heading{align-items:end;margin-bottom:17px}.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:126px;padding:0 16px;border:1px solid #ffc09e;border-radius:5px;background:var(--accent);color:#2b180f;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:65px 12px 90px;background:#0d0d0c;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3b3b3b}.title{height:22px;margin-left:2px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.grid{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}.slot.scan{background:#a0a0a0;box-shadow:inset 0 0 0 2px var(--accent)}.slot.protected{box-shadow:inset 0 0 0 2px var(--safe);background:#859894}.slot.flash::after{content:"LOCKED";position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);z-index:40;padding:4px 6px;background:#163e36;color:#aaf3e3;border:1px solid var(--safe);font:800 9px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.8vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111}.cursor{position:absolute;width:24px;height:32px;z-index:35;background:#fff;clip-path:polygon(0 0,0 85%,25% 65%,42% 100%,58% 92%,42% 59%,75% 58%);filter:drop-shadow(2px 2px 0 #111);opacity:0;transition:left .18s linear,top .18s linear}.cursor.show{opacity:1}.drop{position:absolute;z-index:25;animation:drop .72s cubic-bezier(.35,.05,.8,.45) forwards;filter:drop-shadow(2px 2px #0008)}@keyframes drop{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}45%{transform:translate(var(--x),-38px) rotate(var(--r)) scale(.9);opacity:1}100%{transform:translate(var(--x2),110px) rotate(var(--r2)) scale(.5);opacity:0}}
.keys{position:absolute;left:20px;top:19px;display:flex;align-items:center;gap:7px;color:#a9a49e;font-size:12px}.key{padding:7px 9px;text-align:center;color:#fff;background:#292826;border:1px solid #66605a;border-bottom-width:3px;border-radius:4px;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}.key.held{border-color:var(--accent);background:#4b2d1f;color:#ffd7c2;transform:translateY(2px);border-bottom-width:1px}.ground{position:absolute;left:0;right:0;bottom:0;height:56px;border-top:1px solid #3b352e;background:#181512}.ground::before{content:"已丢弃物品落在玩家脚边";position:absolute;left:50%;top:19px;transform:translateX(-50%);color:#817870;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap}
.legend{position:absolute;right:20px;top:20px;display:flex;align-items:center;gap:8px;color:#a7aaa8;font-size:11px}.safe-dot{width:9px;height:9px;background:var(--safe);box-shadow:0 0 0 3px #69d6bd20}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric.safe b{color:var(--safe)}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#d0ccc6;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#706a64}.status.running::before,.status.done::before{background:var(--accent)}.status.running::before{box-shadow:0 0 0 4px #ee936320}.pager{padding-top:17px;border-top:1px solid #302d2a}.pager a:last-child{color:var(--accent)}
@media(max-width:720px){.heading{align-items:start;flex-direction:column}.demo{min-height:495px;padding:72px 5px 82px}.readout{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.legend{right:11px;top:52px}.keys{left:10px;top:14px}.file{max-width:130px;text-align:right;word-break:break-all}.cursor{width:20px;height:27px}}
@media(prefers-reduced-motion:reduce){.cursor{transition:none}.drop{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">bulk-discard.html</span></nav>
  <header class="heading"><div><p class="eyebrow">03 / BULK DISCARD</p><h1>批量丢弃与保护</h1><p class="summary">Shift + Q 拖过背包，整堆垃圾被抛出；贵重物品和工具按保护规则跳过。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>
  <section class="demo" id="stage" aria-label="点击播放批量丢弃动画">
    <div class="keys"><span class="key" data-key>SHIFT</span><span>+</span><span class="key" data-key>Q</span><span>+</span><span class="key" data-key>LMB</span></div>
    <div class="legend"><i class="safe-dot"></i><span>保护规则已开启</span></div>
    <div class="mc-window"><div class="title">物品栏</div><div class="grid" id="inventory">
      <div class="slot source" data-name="cobble" data-count="64"><div class="item" data-item="cobble"></div><span class="count">64</span></div>
      <div class="slot source" data-name="dirt" data-count="64"><div class="item" data-item="dirt"></div><span class="count">64</span></div>
      <div class="slot source" data-name="gravel" data-count="48"><div class="item" data-item="gravel"></div><span class="count">48</span></div>
      <div class="slot source" data-name="granite" data-count="64"><div class="item" data-item="granite"></div><span class="count">64</span></div>
      <div class="slot source protected" data-name="diamond" data-protected="true" data-count="7"><div class="item" data-item="diamond"></div><span class="count">7</span></div>
      <div class="slot source" data-name="cobble" data-count="64"><div class="item" data-item="cobble"></div><span class="count">64</span></div>
      <div class="slot source" data-name="dirt" data-count="32"><div class="item" data-item="dirt"></div><span class="count">32</span></div>
      <div class="slot source protected" data-name="pickaxe" data-protected="true" data-count="1"><div class="item" data-item="pickaxe"></div></div>
      <div class="slot source" data-name="netherrack" data-count="64"><div class="item" data-item="netherrack"></div><span class="count">64</span></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"><div class="item" data-item="torch"></div><span class="count">19</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div><div style="height:8px"></div><div class="grid"><div class="slot"><div class="item" data-item="torch"></div><span class="count">64</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div>
    <div class="cursor" id="cursor"></div><div class="ground"></div>
  </section>
  <div class="readout"><div class="metric"><b>7 堆 / 400 个</b><span>安全丢弃</span></div><div class="metric safe"><b>2 个槽位保留</b><span>钻石和镐</span></div><div class="metric"><b>1 条路径</b><span>Shift + Q 拖拽</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="drag-transfer.html">&#8592; 拖拽横扫整行</a><a href="recipe-save.html">配方捕获与保存 &#8594;</a></nav>
</main>
<script>
const SPRITES={
  cobble:{p:{a:'#aaa',b:'#888',c:'#686868',d:'#505050'},g:['aabbccaa','bccabbba','cadccbbc','bccaaacd','adccbbca','cbaadcbb','acbbccaa','bcaabbcc']},dirt:{p:{a:'#9a704b',b:'#7c5638',c:'#62422b',d:'#4e321f'},g:['aabbabaa','baccbbab','abbacbba','cbbaabac','bacbbbaa','abbacbba','bcbaabbc','abacbbaa']},gravel:{p:{a:'#b0aaa1',b:'#8f8981',c:'#6f6b68',d:'#565353'},g:['abcaabbc','bcabbcaa','aabccabb','cbbaadbc','baccbbaa','abbcadbc','bcabbaac','aaccbbca']},granite:{p:{a:'#bd806b',b:'#9b6252',c:'#7b4b42',d:'#5f3932'},g:['abcaabbc','bcabbcaa','aabccabb','cbbaadbc','baccbbaa','abbcadbc','bcabbaac','aaccbbca']},netherrack:{p:{a:'#a34d50',b:'#80383e',c:'#63292f',d:'#491e24'},g:['abcaabbc','bcabbcaa','aabccabb','cbbaadbc','baccbbaa','abbcadbc','bcabbaac','aaccbbca']},diamond:{p:{a:'#d8ffff',b:'#8af1ee',c:'#43ced1',d:'#178f96',e:'#0d5d64'},g:['........','...aa...','..abba..','.abccba.','.bcddcb.','..cdec..','...de...','........']},pickaxe:{p:{a:'#d8ffff',b:'#4bcdd0',c:'#6f4d2c',d:'#402b19'},g:['.aaaaaa.','abb.bba.','....c...','....c...','...cc...','...c....','..dd....','........']},torch:{p:{a:'#fff18a',b:'#f0b840',c:'#9b6a30',d:'#69401f'},g:['...aa...','..abba..','...bb...','...cc...','...cc...','...cd...','...dd...','........']}
};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}const CACHE={};function paint(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}paint();
const stage=document.getElementById('stage'),slots=[...document.querySelectorAll('.source')],cursor=document.getElementById('cursor'),keys=[...document.querySelectorAll('[data-key]')],status=document.getElementById('status'),playButton=document.getElementById('play');const initial=slots.map(s=>s.innerHTML),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function move(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();cursor.style.left=(b.left-a.left+b.width*.55)+'px';cursor.style.top=(b.top-a.top+b.height*.45)+'px'}
function reset(){slots.forEach((s,i)=>{s.innerHTML=initial[i];s.classList.remove('scan','flash')});paint();cursor.classList.remove('show');keys.forEach(k=>k.classList.remove('held'));status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.firstElementChild.textContent='\u25b6';playButton.lastElementChild.textContent='播放动画';finished=false}
function toss(slot,name,index){const a=stage.getBoundingClientRect(),b=slot.getBoundingClientRect(),el=document.createElement('div'),x=(index-4)*8,r=index%2?55:-48;el.className='item drop';el.style.backgroundImage=`url(${CACHE[name]})`;el.style.width=(b.width*.72)+'px';el.style.height=(b.height*.72)+'px';el.style.left=(b.left-a.left+b.width*.14)+'px';el.style.top=(b.top-a.top+b.height*.14)+'px';el.style.setProperty('--x',`${x}px`);el.style.setProperty('--x2',`${x*1.4}px`);el.style.setProperty('--r',`${r}deg`);el.style.setProperty('--r2',`${r*2}deg`);stage.appendChild(el);setTimeout(()=>el.remove(),reduce?10:760)}
async function play(){if(playing)return;if(finished)reset();playing=true;keys.forEach(k=>k.classList.add('held'));status.className='status running';status.textContent='丢弃扫描开始：保护规则会在执行前检查槽位';playButton.lastElementChild.textContent='播放中';move(slots[0]);cursor.classList.add('show');await wait(280);let discarded=0;for(let i=0;i<slots.length;i++){const slot=slots[i];move(slot);slot.classList.add('scan');status.textContent=`检查槽位 ${i+1} / ${slots.length}`;await wait(190);if(slot.dataset.protected){slot.classList.remove('scan');slot.classList.add('flash');status.textContent=`槽位 ${i+1} 已保护，跳过 ${slot.dataset.name}`;await wait(420);slot.classList.remove('flash')}else{toss(slot,slot.dataset.name,i);discarded+=Number(slot.dataset.count);slot.innerHTML='';await wait(225)}slot.classList.remove('scan')}cursor.classList.remove('show');keys.forEach(k=>k.classList.remove('held'));status.className='status done';status.textContent=`完成：丢弃 ${discarded} 个垃圾物品，2 个受保护槽保持不变`;playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);
if(new URLSearchParams(location.search).get('autoplay')==='1')setTimeout(play,450);
</script>
</body>
</html>
