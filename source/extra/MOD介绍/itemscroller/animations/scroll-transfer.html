<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>滚轮逐个转移 - Item Scroller 动画</title>
<style>
:root{--bg:#101214;--surface:#1a1d20;--line:#363c41;--text:#f3f5f6;--muted:#a7afb6;--accent:#63d59a;--slot:clamp(27px,5.6vw,44px)}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}
button,a{font:inherit}.page{width:min(1040px,calc(100% - 24px));margin:auto;padding:20px 0 34px}
.topbar,.actions,.pager{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbar{margin-bottom:28px}
.back,.pager a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}.back:hover,.pager a:hover{color:#fff}
.file{color:#7f8991;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}
.heading{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:17px}
.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}
h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}
.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:126px;height:42px;padding:0 16px;border:1px solid #8ae6b7;border-radius:5px;background:var(--accent);color:#102218;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:510px;display:flex;align-items:center;justify-content:center;gap:30px;overflow:hidden;padding:28px;background:#0b0d0e;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}
.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#404040}
.mc-title{height:21px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff;margin-left:2px}.mc-title.player{margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}
.slot.active{background:#a0a0a0;box-shadow:inset 0 0 0 2px #fff}.slot.target{box-shadow:inset 0 0 0 2px var(--accent)}
.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.8vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111;z-index:2}
.wheel-unit{width:104px;display:flex;flex-direction:column;align-items:center;gap:10px}.mouse{width:42px;height:66px;position:relative;border:3px solid #e5e7e9;border-radius:19px;background:#181b1d;box-shadow:0 5px 0 #0006}.mouse::before{content:"";position:absolute;left:16px;top:10px;width:7px;height:15px;border-radius:5px;background:var(--accent)}
.mouse.spinning::before{animation:wheel .22s linear infinite}.wheel-label{color:#cad0d4;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}.tick{color:var(--accent);font-size:12px;font-weight:900;min-height:18px}
@keyframes wheel{0%{transform:translateY(5px);opacity:.35}100%{transform:translateY(-5px);opacity:1}}
.cursor{position:absolute;width:22px;height:30px;z-index:20;background:#fff;clip-path:polygon(0 0,0 85%,25% 65%,42% 100%,58% 92%,42% 59%,75% 58%);filter:drop-shadow(2px 2px 0 #111);opacity:0;transition:left .18s ease,top .18s ease}.cursor.show{opacity:1}
.flying{position:absolute;z-index:18;transition:left .16s ease-in,top .16s ease-in,transform .16s ease-in;filter:drop-shadow(2px 3px 0 #0008)}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#cbd1d5;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#687078}.status.running::before{background:var(--accent);box-shadow:0 0 0 4px #63d59a20}.status.done::before{background:var(--accent)}
.pager{padding-top:17px;border-top:1px solid #2b3034}.pager a:last-child{color:var(--accent)}
@media(max-width:720px){.heading{align-items:start;flex-direction:column}.demo{min-height:500px;flex-direction:column;padding:22px 8px;gap:20px}.wheel-unit{width:auto}.mouse{transform:scale(.8)}.readout{grid-template-columns:1fr}.metric{display:flex;justify-content:space-between;align-items:center}.metric span{margin:0}.topbar{align-items:flex-start}.file{max-width:130px;text-align:right;word-break:break-all}}
@media(prefers-reduced-motion:reduce){.cursor,.flying{transition:none}.mouse.spinning::before{animation:none}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">scroll-transfer.html</span></nav>
  <header class="heading"><div><p class="eyebrow">01 / WHEEL TRANSFER</p><h1>滚轮逐个转移</h1><p class="summary">普通滚轮每个刻度移动 1 个物品，来源堆和目标堆的数量实时同步。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>

  <section class="demo" id="stage" aria-label="点击播放滚轮转移动画">
    <div class="mc-window" id="window">
      <div class="mc-title">箱子</div>
      <div class="grid" id="chest-grid">
        <div class="slot" id="source"><div class="item" data-item="diamond"></div><span class="count" id="source-count">32</span></div>
        <div class="slot"><div class="item" data-item="cobble"></div><span class="count">64</span></div>
        <div class="slot"><div class="item" data-item="log"></div><span class="count">28</span></div>
        <div class="slot"></div><div class="slot"><div class="item" data-item="iron"></div><span class="count">17</span></div><div class="slot"></div><div class="slot"></div><div class="slot"><div class="item" data-item="torch"></div><span class="count">48</span></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"><div class="item" data-item="cobble"></div><span class="count">19</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
      <div class="mc-title player">物品栏</div>
      <div class="grid">
        <div class="slot"></div><div class="slot"></div><div class="slot" id="target"><div class="item" data-item="diamond"></div><span class="count" id="target-count">12</span></div><div class="slot"><div class="item" data-item="torch"></div><span class="count">16</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"><div class="item" data-item="cobble"></div><span class="count">37</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
      <div style="height:7px"></div>
      <div class="grid"><div class="slot"><div class="item" data-item="iron"></div><span class="count">8</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
    </div>
    <div class="wheel-unit"><div class="mouse" id="mouse"></div><div class="wheel-label">滚轮向上</div><div class="tick" id="tick">8 个刻度</div></div>
    <div class="cursor" id="cursor" aria-hidden="true"></div>
  </section>

  <div class="readout"><div class="metric"><b>32 &#8594; 24</b><span>箱子中的钻石</span></div><div class="metric"><b>12 &#8594; 20</b><span>背包中的钻石</span></div><div class="metric"><b>1 / 刻度</b><span>普通滚轮模式</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="index.html">&#8592; 动画目录</a><a href="drag-transfer.html">拖拽横扫整行 &#8594;</a></nav>
</main>
<script>
const SPRITES={
  diamond:{p:{a:'#d8ffff',b:'#8af1ee',c:'#43ced1',d:'#178f96',e:'#0d5d64'},g:['........','...aa...','..abba..','.abccba.','.bcddcb.','..cdec..','...de...','........']},
  cobble:{p:{a:'#aaa',b:'#888',c:'#696969',d:'#515151'},g:['aabbccaa','bccabbba','cadccbbc','bccaaacd','adccbbca','cbaadcbb','acbbccaa','bcaabbcc']},
  log:{p:{a:'#a87843',b:'#80582f',c:'#61401f',d:'#3e2815'},g:['abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc']},
  iron:{p:{a:'#f1f1ec',b:'#c8c9c4',c:'#999b98',d:'#707270'},g:['........','..aaaa..','.abbbba.','abccccba','abccccba','.bcddcb.','..cddc..','........']},
  torch:{p:{a:'#fff18a',b:'#f0b840',c:'#9b6a30',d:'#69401f'},g:['...aa...','..abba..','...bb...','...cc...','...cc...','...cd...','...dd...','........']}
};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}
const CACHE={};function apply(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}apply();
const stage=document.getElementById('stage'),source=document.getElementById('source'),target=document.getElementById('target'),sourceCount=document.getElementById('source-count'),targetCount=document.getElementById('target-count'),cursor=document.getElementById('cursor'),mouse=document.getElementById('mouse'),tick=document.getElementById('tick'),status=document.getElementById('status'),playButton=document.getElementById('play');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function pointCursor(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();cursor.style.left=(b.left-a.left+b.width*.52)+'px';cursor.style.top=(b.top-a.top+b.height*.46)+'px'}
function reset(){sourceCount.textContent='32';targetCount.textContent='12';source.classList.remove('active');target.classList.remove('target');cursor.classList.remove('show');mouse.classList.remove('spinning');tick.textContent='8 个刻度';status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.lastElementChild.textContent='播放动画';finished=false}
async function fly(){const a=stage.getBoundingClientRect(),s=source.getBoundingClientRect(),t=target.getBoundingClientRect(),el=document.createElement('div');el.className='item flying';el.style.backgroundImage=`url(${CACHE.diamond})`;el.style.width=(s.width*.72)+'px';el.style.height=(s.height*.72)+'px';el.style.left=(s.left-a.left+s.width*.14)+'px';el.style.top=(s.top-a.top+s.height*.14)+'px';stage.appendChild(el);await wait(20);el.style.left=(t.left-a.left+t.width*.14)+'px';el.style.top=(t.top-a.top+t.height*.14)+'px';el.style.transform='scale(.72)';await wait(175);el.remove()}
async function play(){if(playing)return;if(finished)reset();playing=true;status.className='status running';status.textContent='滚轮输入中：每个刻度移动 1 颗钻石';playButton.lastElementChild.textContent='播放中';pointCursor(source);cursor.classList.add('show');source.classList.add('active');target.classList.add('target');mouse.classList.add('spinning');await wait(320);for(let i=1;i<=8;i++){tick.textContent=`第 ${i} / 8 刻度`;await fly();sourceCount.textContent=String(32-i);targetCount.textContent=String(12+i);await wait(85)}mouse.classList.remove('spinning');source.classList.remove('active');cursor.classList.remove('show');status.className='status done';status.textContent='完成：8 颗钻石已逐个并入背包堆叠';tick.textContent='转移完成';playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);addEventListener('resize',()=>{if(cursor.classList.contains('show'))pointCursor(source)});
if(new URLSearchParams(location.search).get('autoplay')==='1')setTimeout(play,450);
</script>
</body>
</html>
