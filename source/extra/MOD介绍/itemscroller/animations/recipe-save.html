<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>配方捕获与保存 - Item Scroller 动画</title>
<style>
:root{--bg:#101314;--surface:#1a2022;--line:#354248;--text:#f1f5f6;--muted:#a6b2b7;--accent:#58c8d2;--slot:clamp(27px,4.8vw,42px)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.page{width:min(1080px,calc(100% - 24px));margin:auto;padding:20px 0 34px}.topbar,.heading,.pager{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{margin-bottom:28px}.back,.pager a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.back:hover,.pager a:hover{color:#fff}.file{color:#7f8b90;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}.heading{align-items:end;margin-bottom:17px}.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:126px;padding:0 16px;border:1px solid #91e6ed;border-radius:5px;background:var(--accent);color:#10272a;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:570px;display:flex;align-items:center;justify-content:center;gap:24px;overflow:hidden;padding:60px 18px 30px;background:#0b0e0f;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3c3c3c}.title{height:21px;margin-left:2px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.craft-row{display:flex;align-items:center;gap:18px;padding:4px 15px 12px}.craft-wrap{position:relative}.grid{display:grid;grid-template-columns:repeat(3,var(--slot));gap:2px}.inventory{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}.slot.output{width:calc(var(--slot) + 7px);height:calc(var(--slot) + 7px)}.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.7vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111}.craft-arrow{color:#5b5b5b;font-size:30px;font-weight:900}.scanline{position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent);box-shadow:0 0 8px var(--accent);opacity:0}.scanline.run{animation:scan .85s ease-in-out 2}@keyframes scan{0%{top:0;opacity:0}15%{opacity:.9}85%{opacity:.9}100%{top:calc(100% - 4px);opacity:0}}
.recipe-panel{width:232px;min-height:298px;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3b3b3b;opacity:0;transform:translateX(22px);transition:opacity .25s ease,transform .25s ease}.recipe-panel.open{opacity:1;transform:none}.recipe-head{display:flex;justify-content:space-between;align-items:center;height:25px;font:700 12px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.recipes{display:grid;grid-template-columns:repeat(4,47px);gap:5px}.recipe{width:47px;height:47px;position:relative;display:flex;align-items:center;justify-content:center;background:#777;border:2px solid;border-color:#373737 #fff #fff #373737}.recipe.selected{box-shadow:inset 0 0 0 2px var(--accent)}.recipe.saved{animation:saved .45s ease-out}.recipe-no{position:absolute;left:2px;top:1px;color:#dedede;font:700 8px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #111}@keyframes saved{0%{transform:scale(.7);background:#e8ffff}100%{transform:scale(1);background:#777}}
.keys{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:8px;color:#aab2b6;font-size:12px}.key{padding:7px 10px;color:#fff;background:#252b2d;border:1px solid #5c696e;border-bottom-width:3px;border-radius:4px;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}.key.held{border-color:var(--accent);background:#1e464a;color:#c7fbff;transform:translateY(2px);border-bottom-width:1px}.cursor{position:absolute;width:23px;height:31px;z-index:40;background:#fff;clip-path:polygon(0 0,0 85%,25% 65%,42% 100%,58% 92%,42% 59%,75% 58%);filter:drop-shadow(2px 2px 0 #111);opacity:0;transition:left .25s ease,top .25s ease}.cursor.show{opacity:1}.click-ring{position:absolute;width:26px;height:26px;border:3px solid var(--accent);border-radius:50%;z-index:35;animation:ring .45s ease-out forwards;pointer-events:none}@keyframes ring{from{transform:scale(.25);opacity:1}to{transform:scale(1.6);opacity:0}}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#ccd3d6;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#687378}.status.running::before,.status.done::before{background:var(--accent)}.status.running::before{box-shadow:0 0 0 4px #58c8d220}.pager{padding-top:17px;border-top:1px solid #293236}.pager a:last-child{color:var(--accent)}
@media(max-width:790px){.heading{align-items:start;flex-direction:column}.demo{min-height:705px;flex-direction:column;padding:60px 6px 24px;gap:17px}.recipe-panel{transform:translateY(15px)}.readout{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.file{max-width:130px;text-align:right;word-break:break-all}.keys{left:10px;top:13px}.cursor{width:20px;height:27px}}
@media(prefers-reduced-motion:reduce){.recipe-panel,.cursor{transition:none}.scanline.run,.recipe.saved,.click-ring{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">recipe-save.html</span></nav>
  <header class="heading"><div><p class="eyebrow">04 / RECIPE STORAGE</p><h1>配方捕获与保存</h1><p class="summary">打开配方面板，读取工作台的真实 3 x 3 布局，再把木镐配方写入独立槽位。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>
  <section class="demo" id="stage" aria-label="点击播放配方保存动画">
    <div class="keys"><span class="key" id="a-key">A</span><span>打开面板</span><span class="key" id="middle-key">MMB</span><span>保存</span></div>
    <div class="mc-window">
      <div class="title">合成</div><div class="craft-row"><div class="craft-wrap" id="craft-wrap"><div class="grid">
        <div class="slot"><div class="item" data-item="plank"></div></div><div class="slot"><div class="item" data-item="plank"></div></div><div class="slot"><div class="item" data-item="plank"></div></div>
        <div class="slot"></div><div class="slot"><div class="item" data-item="stick"></div></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"><div class="item" data-item="stick"></div></div><div class="slot"></div>
      </div><div class="scanline" id="scanline"></div></div><div class="craft-arrow">&#8594;</div><div class="slot output" id="output"><div class="item" data-item="pickaxe"></div></div></div>
      <div class="title">物品栏</div><div class="inventory">
        <div class="slot"><div class="item" data-item="plank"></div><span class="count">21</span></div><div class="slot"><div class="item" data-item="stick"></div><span class="count">14</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
        <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
    </div>
    <aside class="recipe-panel" id="panel" aria-label="Item Scroller 配方面板"><div class="recipe-head"><span>Item Scroller 配方</span><span>1 / 12</span></div><div class="recipes">
      <div class="recipe" id="save-slot"><span class="recipe-no">01</span></div><div class="recipe"><span class="recipe-no">02</span><div class="item" data-item="torch"></div></div><div class="recipe"><span class="recipe-no">03</span><div class="item" data-item="chest"></div></div><div class="recipe"><span class="recipe-no">04</span></div>
      <div class="recipe"><span class="recipe-no">05</span></div><div class="recipe"><span class="recipe-no">06</span></div><div class="recipe"><span class="recipe-no">07</span></div><div class="recipe"><span class="recipe-no">08</span></div>
      <div class="recipe"><span class="recipe-no">09</span></div><div class="recipe"><span class="recipe-no">10</span></div><div class="recipe"><span class="recipe-no">11</span></div><div class="recipe"><span class="recipe-no">12</span></div>
    </div></aside>
    <div class="cursor" id="cursor"></div>
  </section>
  <div class="readout"><div class="metric"><b>3 x 3</b><span>完整配方布局</span></div><div class="metric"><b>144 个</b><span>可保存配方容量</span></div><div class="metric"><b>槽位 01</b><span>本次保存位置</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="bulk-discard.html">&#8592; 批量丢弃与保护</a><a href="bulk-craft.html">循环批量合成 &#8594;</a></nav>
</main>
<script>
const SPRITES={plank:{p:{a:'#d1a66a',b:'#b88c50',c:'#966f3d',d:'#74522d'},g:['aaaaaaaa','bbbbbbbb','ccccdccc','aaaaaaaa','bbbbbbbb','ccccdccc','aaaaaaaa','bbbbbbbb']},stick:{p:{a:'#c99b5c',b:'#885f31'},g:['......aa','.....aa.','....aa..','...aa...','..aa....','.aa.....','aa......','........']},pickaxe:{p:{a:'#d2a263',b:'#a7763f',c:'#6f4d2c',d:'#402b19'},g:['.aaaaaa.','abb.bba.','....c...','....c...','...cc...','...c....','..dd....','........']},torch:{p:{a:'#fff18a',b:'#f0b840',c:'#9b6a30',d:'#69401f'},g:['...aa...','..abba..','...bb...','...cc...','...cc...','...cd...','...dd...','........']},chest:{p:{a:'#c78943',b:'#9a632f',c:'#71451f',d:'#d4d4c9',e:'#585858'},g:['........','.aaaaaa.','.abbbba.','.acccca.','.abdbba.','.abebba.','.aaaaaa.','........']}};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}const CACHE={};function paint(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}paint();
const stage=document.getElementById('stage'),panel=document.getElementById('panel'),scanline=document.getElementById('scanline'),saveSlot=document.getElementById('save-slot'),output=document.getElementById('output'),cursor=document.getElementById('cursor'),aKey=document.getElementById('a-key'),middleKey=document.getElementById('middle-key'),status=document.getElementById('status'),playButton=document.getElementById('play');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function move(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();cursor.style.left=(b.left-a.left+b.width*.52)+'px';cursor.style.top=(b.top-a.top+b.height*.5)+'px'}
function ring(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect(),r=document.createElement('i');r.className='click-ring';r.style.left=(b.left-a.left+b.width/2-13)+'px';r.style.top=(b.top-a.top+b.height/2-13)+'px';stage.appendChild(r);setTimeout(()=>r.remove(),reduce?10:500)}
function reset(){panel.classList.remove('open');scanline.classList.remove('run');saveSlot.classList.remove('selected','saved');saveSlot.innerHTML='<span class="recipe-no">01</span>';cursor.classList.remove('show');aKey.classList.remove('held');middleKey.classList.remove('held');status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.firstElementChild.textContent='\u25b6';playButton.lastElementChild.textContent='播放动画';finished=false}
async function play(){if(playing)return;if(finished)reset();playing=true;status.className='status running';status.textContent='按下 A，打开 Item Scroller 配方面板';playButton.lastElementChild.textContent='播放中';aKey.classList.add('held');await wait(300);panel.classList.add('open');await wait(430);aKey.classList.remove('held');status.textContent='读取工作台 3 x 3 材料布局与输出物';move(output);cursor.classList.add('show');scanline.classList.add('run');await wait(1500);status.textContent='将光标移到空配方槽，按鼠标中键保存';move(saveSlot);saveSlot.classList.add('selected');await wait(420);middleKey.classList.add('held');ring(saveSlot);await wait(260);saveSlot.innerHTML='<span class="recipe-no">01</span><div class="item" data-item="pickaxe"></div>';paint(saveSlot);saveSlot.classList.add('saved');middleKey.classList.remove('held');await wait(420);cursor.classList.remove('show');status.className='status done';status.textContent='完成：木镐配方已保存到槽位 01，可在任意工作台调用';playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);
</script>
</body>
</html>
