<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>循环批量合成 - Item Scroller 动画</title>
<style>
:root{--bg:#141112;--surface:#211a1d;--line:#46383e;--text:#f7f2f4;--muted:#b4a8ad;--accent:#ef6ea8;--slot:clamp(27px,5vw,42px)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.page{width:min(1080px,calc(100% - 24px));margin:auto;padding:20px 0 34px}.topbar,.heading,.pager{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{margin-bottom:28px}.back,.pager a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.back:hover,.pager a:hover{color:#fff}.file{color:#8c8085;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}.heading{align-items:end;margin-bottom:17px}.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:126px;padding:0 16px;border:1px solid #ffabd0;border-radius:5px;background:var(--accent);color:#301422;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:585px;display:flex;align-items:center;justify-content:center;gap:22px;overflow:hidden;padding:66px 15px 32px;background:#0e0b0c;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}.recipe-card{width:132px;padding:8px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3d3d3d}.recipe-title{height:23px;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.recipe-body{padding:8px;background:#777;border:2px solid;border-color:#373737 #fff #fff #373737;box-shadow:inset 0 0 0 2px var(--accent)}.mini-grid{display:grid;grid-template-columns:repeat(3,28px);gap:2px}.mini-slot{width:28px;height:28px;position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:1px solid;border-color:#373737 #fff #fff #373737}.recipe-name{margin-top:8px;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3d3d3d}.title{height:21px;margin-left:2px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.craft-row{display:flex;align-items:center;gap:17px;padding:4px 15px 12px}.grid{display:grid;grid-template-columns:repeat(3,var(--slot));gap:2px}.inventory{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}.slot.output{width:calc(var(--slot) + 7px);height:calc(var(--slot) + 7px)}.slot.pulse{animation:pulse .25s ease}.slot.product{box-shadow:inset 0 0 0 2px var(--accent)}.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.mini-slot .item{width:75%;height:75%}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.7vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111}.craft-arrow{color:#595959;font-size:30px;font-weight:900}@keyframes pulse{0%{box-shadow:inset 0 0 0 2px #fff,0 0 14px var(--accent);transform:scale(.9)}100%{transform:scale(1)}}
.keys{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:7px;color:#b1a7ab;font-size:12px}.key{padding:7px 9px;color:#fff;background:#2c2427;border:1px solid #66535b;border-bottom-width:3px;border-radius:4px;font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}.key.held{border-color:var(--accent);background:#542a3d;color:#ffd5e8;transform:translateY(2px);border-bottom-width:1px}.progress-wrap{position:absolute;left:20px;right:20px;bottom:19px;display:flex;align-items:center;gap:10px}.progress-track{height:8px;flex:1;overflow:hidden;background:#30252a;border:1px solid #4d3b43}.progress{width:0;height:100%;background:var(--accent);transition:width .17s linear}.progress-label{width:82px;color:#b9adb2;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}
.spark{position:absolute;width:5px;height:5px;background:#ffd2e5;z-index:20;animation:spark .48s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y));opacity:0}}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#d3cdd0;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#75676d}.status.running::before,.status.done::before{background:var(--accent)}.status.running::before{box-shadow:0 0 0 4px #ef6ea820}.pager{padding-top:17px;border-top:1px solid #33282d}.pager a:last-child{color:var(--accent)}
@media(max-width:820px){.heading{align-items:start;flex-direction:column}.demo{min-height:730px;flex-direction:column;padding:64px 6px 50px;gap:16px}.recipe-card{width:125px}.mini-grid{grid-template-columns:repeat(3,26px);justify-content:center}.mini-slot{width:26px;height:26px}.readout{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.keys{left:10px;top:13px}.progress-wrap{left:10px;right:10px}.file{max-width:130px;text-align:right;word-break:break-all}}
@media(prefers-reduced-motion:reduce){.progress{transition:none}.slot.pulse,.spark{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">bulk-craft.html</span></nav>
  <header class="heading"><div><p class="eyebrow">05 / CONTINUOUS CRAFT</p><h1>循环批量合成</h1><p class="summary">调用已保存的木板配方，自动填入原木、取出 4 个木板并连续执行 16 次。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>
  <section class="demo" id="stage" aria-label="点击播放循环合成动画">
    <div class="keys"><span class="key" data-key>CTRL</span><span>+</span><span class="key" data-key>ALT</span><span>+</span><span class="key" data-key>C</span></div>
    <aside class="recipe-card"><div class="recipe-title">配方 01 / 144</div><div class="recipe-body"><div class="mini-grid"><div class="mini-slot"></div><div class="mini-slot"></div><div class="mini-slot"></div><div class="mini-slot"></div><div class="mini-slot"><div class="item" data-item="log"></div></div><div class="mini-slot"></div><div class="mini-slot"></div><div class="mini-slot"></div><div class="mini-slot"></div></div><div class="recipe-name">橡木原木 &#8594; 4 木板</div></div></aside>
    <div class="mc-window"><div class="title">合成</div><div class="craft-row"><div class="grid">
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot" id="input"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div><div class="craft-arrow">&#8594;</div><div class="slot output" id="output"></div></div>
    <div class="title">物品栏</div><div class="inventory">
      <div class="slot" id="material"><div class="item" data-item="log"></div><span class="count" id="material-count">32</span></div><div class="slot product" id="product"></div><div class="slot"><div class="item" data-item="cobble"></div><span class="count">42</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div></div>
    <div class="progress-wrap"><div class="progress-track"><div class="progress" id="progress"></div></div><span class="progress-label" id="progress-label">0 / 16 次</span></div>
  </section>
  <div class="readout"><div class="metric"><b>16 原木</b><span>实际消耗</span></div><div class="metric"><b>64 木板</b><span>实际产出</span></div><div class="metric"><b>1 : 4</b><span>原版配方比例</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="recipe-save.html">&#8592; 配方捕获与保存</a><a href="villager-trade.html">收藏村民交易 &#8594;</a></nav>
</main>
<script>
const SPRITES={log:{p:{a:'#a87843',b:'#80582f',c:'#61401f',d:'#3e2815'},g:['abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc']},plank:{p:{a:'#d1a66a',b:'#b88c50',c:'#966f3d',d:'#74522d'},g:['aaaaaaaa','bbbbbbbb','ccccdccc','aaaaaaaa','bbbbbbbb','ccccdccc','aaaaaaaa','bbbbbbbb']},cobble:{p:{a:'#aaa',b:'#888',c:'#686868',d:'#505050'},g:['aabbccaa','bccabbba','cadccbbc','bccaaacd','adccbbca','cbaadcbb','acbbccaa','bcaabbcc']}};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}const CACHE={};function paint(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}paint();
const stage=document.getElementById('stage'),input=document.getElementById('input'),output=document.getElementById('output'),materialCount=document.getElementById('material-count'),product=document.getElementById('product'),progress=document.getElementById('progress'),progressLabel=document.getElementById('progress-label'),keys=[...document.querySelectorAll('[data-key]')],status=document.getElementById('status'),playButton=document.getElementById('play');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function fill(slot,name,count=''){slot.innerHTML=`<div class="item" data-item="${name}"></div>${count?`<span class="count">${count}</span>`:''}`;paint(slot)}
function sparks(){const a=stage.getBoundingClientRect(),b=output.getBoundingClientRect();for(let i=0;i<5;i++){const s=document.createElement('i');s.className='spark';s.style.left=(b.left-a.left+b.width/2)+'px';s.style.top=(b.top-a.top+b.height/2)+'px';s.style.setProperty('--x',`${(i-2)*14}px`);s.style.setProperty('--y',`${-22-Math.abs(i-2)*6}px`);stage.appendChild(s);setTimeout(()=>s.remove(),reduce?10:520)}}
function reset(){input.innerHTML='';output.innerHTML='';materialCount.textContent='32';product.innerHTML='';progress.style.width='0';progressLabel.textContent='0 / 16 次';keys.forEach(k=>k.classList.remove('held'));status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.firstElementChild.textContent='\u25b6';playButton.lastElementChild.textContent='播放动画';finished=false}
async function play(){if(playing)return;if(finished)reset();playing=true;keys.forEach(k=>k.classList.add('held'));status.className='status running';status.textContent='持续合成已启动，配方 01 正在循环';playButton.lastElementChild.textContent='播放中';await wait(280);for(let i=1;i<=16;i++){materialCount.textContent=String(32-i);fill(input,'log');input.classList.add('pulse');await wait(85);fill(output,'plank','4');output.classList.add('pulse');sparks();await wait(105);output.innerHTML='';input.innerHTML='';fill(product,'plank',String(i*4));product.classList.add('pulse');progress.style.width=(i/16*100)+'%';progressLabel.textContent=`${i} / 16 次`;status.textContent=`第 ${i} 次：1 原木 \u2192 4 木板`;await wait(80);input.classList.remove('pulse');output.classList.remove('pulse');product.classList.remove('pulse')}keys.forEach(k=>k.classList.remove('held'));status.className='status done';status.textContent='完成：16 个原木已按原版比例合成为 64 个木板';playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);
if(new URLSearchParams(location.search).get('autoplay')==='1')setTimeout(play,450);
</script>
</body>
</html>
