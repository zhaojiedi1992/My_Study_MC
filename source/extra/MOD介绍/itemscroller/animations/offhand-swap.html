<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>副手快速交换 - Item Scroller 动画</title>
<style>
:root{--bg:#101316;--surface:#192026;--line:#35444e;--text:#f1f5f8;--muted:#a5b1b9;--accent:#64b7e5;--slot:clamp(27px,5.4vw,42px)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.page{width:min(1040px,calc(100% - 24px));margin:auto;padding:20px 0 34px}.topbar,.heading,.pager{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{margin-bottom:28px}.back,.pager a{color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}.back:hover,.pager a:hover{color:#fff}.file{color:#7e8a92;font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace}.heading{align-items:end;margin-bottom:17px}.eyebrow{margin:0 0 6px;color:var(--accent);font:800 12px ui-monospace,SFMono-Regular,Consolas,monospace}h1{margin:0;font-size:clamp(27px,5vw,46px);line-height:1.1;letter-spacing:0}.summary{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.play{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;min-width:126px;padding:0 16px;border:1px solid #a9ddfa;border-radius:5px;background:var(--accent);color:#102633;font-weight:900;cursor:pointer;white-space:nowrap}.play:hover{filter:brightness(1.08)}.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.demo{position:relative;min-height:615px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:58px 8px 25px;background:#0a0d0f;border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none}.mc-window{width:max-content;padding:9px;background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;box-shadow:4px 5px 0 #0008;color:#3b3b3b}.title{height:21px;margin-left:2px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-shadow:1px 1px #fff}.upper{height:178px;display:grid;grid-template-columns:44px 140px 1fr;gap:10px;align-items:center}.armor{display:grid;gap:3px}.slot{width:var(--slot);height:var(--slot);position:relative;display:flex;align-items:center;justify-content:center;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737}.armor .slot{width:36px;height:36px}.slot.hover{background:#a1a1a1;box-shadow:inset 0 0 0 2px #fff}.slot.offhand{box-shadow:inset 0 0 0 2px var(--accent)}.item{width:78%;height:78%;background-position:center;background-repeat:no-repeat;background-size:contain;image-rendering:pixelated;pointer-events:none}.count{position:absolute;right:1px;bottom:0;color:#fff;font:900 clamp(9px,1.7vw,13px) ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1;text-shadow:1px 1px #111,-1px -1px #111,1px -1px #111,-1px 1px #111}.grid{display:grid;grid-template-columns:repeat(9,var(--slot));gap:2px}.model-area{height:165px;position:relative;background:#2b2b2b;border:2px solid;border-color:#555 #eee #eee #555;overflow:hidden}.model{position:absolute;left:50%;top:16px;width:58px;height:130px;transform:translateX(-50%)}.model .head{position:absolute;left:17px;top:0;width:30px;height:30px;background:#bf8a68;border:3px solid #6c4937}.model .body{position:absolute;left:13px;top:30px;width:38px;height:55px;background:#4f78a2;border:3px solid #2f4d6c}.model .legs{position:absolute;left:17px;top:84px;width:30px;height:43px;background:linear-gradient(90deg,#333 0 43%,transparent 43% 57%,#333 57%);border-top:3px solid #222}.model .arm{position:absolute;top:34px;width:14px;height:57px;background:#bf8a68;border:3px solid #6c4937;transform-origin:top}.model .arm.left{left:0;transform:rotate(8deg)}.model .arm.right{right:-5px;transform:rotate(-11deg)}.held-item{position:absolute;right:-26px;top:70px;width:34px;height:45px;background:#5d7690;border:3px solid #31485e;transform:rotate(-9deg);transition:all .28s ease}.held-item.torch{width:10px;height:49px;right:-15px;top:65px;background:#9a682f;border:2px solid #65431f;box-shadow:0 -12px 0 2px #f2bd45,0 -12px 10px #f0a52d}
.crafting{align-self:start;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-top:24px}.craft-grid{display:grid;grid-template-columns:repeat(2,32px);gap:2px}.craft-grid .slot{width:32px;height:32px}.craft-arrow{color:#5d5d5d;font-size:24px}.output{width:40px;height:40px}.offhand-label{position:absolute;left:9px;bottom:8px;color:#8a8a8a;font:700 8px ui-monospace,SFMono-Regular,Consolas,monospace}.cursor{position:absolute;width:24px;height:32px;z-index:40;background:#fff;clip-path:polygon(0 0,0 85%,25% 65%,42% 100%,58% 92%,42% 59%,75% 58%);filter:drop-shadow(2px 2px 0 #111);opacity:0;transition:left .3s ease,top .3s ease}.cursor.show{opacity:1}.flying{position:absolute;z-index:30;transition:left .35s cubic-bezier(.4,0,.2,1),top .35s cubic-bezier(.4,0,.2,1),transform .35s ease;filter:drop-shadow(2px 3px #0008)}
.key-wrap{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:9px;color:#aab4bb;font-size:12px}.key{min-width:40px;padding:8px 10px;color:#fff;background:#242b30;border:1px solid #586873;border-bottom-width:3px;border-radius:4px;font:900 13px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}.key.held{border-color:var(--accent);background:#224156;color:#d7f2ff;transform:translateY(2px);border-bottom-width:1px}.swap-label{position:absolute;right:20px;top:22px;color:#90a0aa;font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace}.flash{animation:flash .42s ease}@keyframes flash{0%{box-shadow:inset 0 0 0 2px #fff,0 0 18px var(--accent)}100%{box-shadow:none}}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--line)}.metric{padding:13px 15px;background:var(--surface)}.metric b{display:block;color:var(--accent);font-size:16px}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.status{display:flex;align-items:center;gap:9px;min-height:22px;margin:13px 2px 22px;color:#cbd3d8;font-size:13px}.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#64717a}.status.running::before,.status.done::before{background:var(--accent)}.status.running::before{box-shadow:0 0 0 4px #64b7e520}.pager{padding-top:17px;border-top:1px solid #29353c}.pager a:first-child{color:var(--accent)}
@media(max-width:720px){.heading{align-items:start;flex-direction:column}.demo{min-height:575px;padding:58px 4px 20px}.upper{height:155px;grid-template-columns:38px 116px 1fr;gap:5px}.model-area{height:145px}.model{transform:translateX(-50%) scale(.85);transform-origin:top}.armor .slot{width:31px;height:31px}.craft-grid{grid-template-columns:repeat(2,25px)}.craft-grid .slot{width:25px;height:25px}.crafting{gap:5px}.output{width:32px;height:32px}.readout{grid-template-columns:1fr}.metric{display:flex;align-items:center;justify-content:space-between}.metric span{margin:0}.key-wrap{left:10px;top:13px}.swap-label{right:10px}.file{max-width:130px;text-align:right;word-break:break-all}.cursor{width:20px;height:27px}}
@media(prefers-reduced-motion:reduce){.cursor,.flying,.held-item{transition:none}.flash{animation:none}}
</style>
</head>
<body>
<main class="page">
  <nav class="topbar"><a class="back" href="index.html">&#8592; 全部动画</a><span class="file">offhand-swap.html</span></nav>
  <header class="heading"><div><p class="eyebrow">07 / OFFHAND SWAP</p><h1>副手快速交换</h1><p class="summary">背包打开时悬停火把堆并按 F，悬停槽和副手槽直接交换，无需手动拖动。</p></div><button class="play" id="play" type="button"><span aria-hidden="true">&#9654;</span><span>播放动画</span></button></header>
  <section class="demo" id="stage" aria-label="点击播放副手交换动画">
    <div class="key-wrap"><span class="key" id="f-key">F</span><span>交换副手</span></div><div class="swap-label">HOVER SLOT &#8596; OFFHAND</div>
    <div class="mc-window"><div class="title">合成</div><div class="upper">
      <div class="armor"><div class="slot"><div class="item" data-item="helmet"></div></div><div class="slot"></div><div class="slot"><div class="item" data-item="chestplate"></div></div><div class="slot"></div></div>
      <div class="model-area"><div class="model"><i class="head"></i><i class="body"></i><i class="legs"></i><i class="arm left"></i><i class="arm right"></i><i class="held-item" id="held-item"></i></div><div class="slot offhand" id="offhand"><div class="item" data-item="shield"></div><span class="offhand-label">副手</span></div></div>
      <div class="crafting"><div class="craft-grid"><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div><span class="craft-arrow">&#8594;</span><div class="slot output"></div></div>
    </div><div class="title">物品栏</div><div class="grid">
      <div class="slot"><div class="item" data-item="cobble"></div><span class="count">32</span></div><div class="slot"></div><div class="slot"></div><div class="slot" id="source"><div class="item" data-item="torch"></div><span class="count">48</span></div><div class="slot"></div><div class="slot"><div class="item" data-item="log"></div><span class="count">17</span></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
    </div><div style="height:7px"></div><div class="grid"><div class="slot"><div class="item" data-item="pickaxe"></div></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div>
    <div class="cursor" id="cursor"></div>
  </section>
  <div class="readout"><div class="metric"><b>1 次按键</b><span>完成双向交换</span></div><div class="metric"><b>48 火把 &#8594; 副手</b><span>完整堆叠保留</span></div><div class="metric"><b>盾牌 &#8594; 背包</b><span>原副手物品回填</span></div></div>
  <div class="status" id="status" aria-live="polite">准备就绪，点击画面或播放按钮</div>
  <nav class="pager"><a href="villager-trade.html">&#8592; 收藏村民交易</a><a href="index.html">返回动画目录 &#8594;</a></nav>
</main>
<script>
const SPRITES={torch:{p:{a:'#fff18a',b:'#f0b840',c:'#9b6a30',d:'#69401f'},g:['...aa...','..abba..','...bb...','...cc...','...cc...','...cd...','...dd...','........']},shield:{p:{a:'#91a7b7',b:'#637b8d',c:'#415a6c',d:'#293e4d'},g:['.aaaaaa.','.abbbba.','.abccba.','.abccba.','..bccb..','..bccb..','...dd...','........']},helmet:{p:{a:'#b4c1c8',b:'#87969e',c:'#647179'},g:['..aaaa..','.abbbba.','abccccba','ab....ba','ab....ba','........','........','........']},chestplate:{p:{a:'#b4c1c8',b:'#87969e',c:'#647179'},g:['aa....aa','abaaaaba','abbbbbba','abccccba','abccccba','abccccba','.bccccb.','........']},cobble:{p:{a:'#aaa',b:'#888',c:'#686868',d:'#505050'},g:['aabbccaa','bccabbba','cadccbbc','bccaaacd','adccbbca','cbaadcbb','acbbccaa','bcaabbcc']},log:{p:{a:'#a87843',b:'#80582f',c:'#61401f',d:'#3e2815'},g:['abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc','abcbabca','bcdcbcdc']},pickaxe:{p:{a:'#d8ffff',b:'#4bcdd0',c:'#6f4d2c',d:'#402b19'},g:['.aaaaaa.','abb.bba.','....c...','....c...','...cc...','...c....','..dd....','........']}};
function sprite(name){const s=SPRITES[name],c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=32;x.imageSmoothingEnabled=false;s.g.forEach((row,y)=>[...row].forEach((v,i)=>{if(v!=='.'){x.fillStyle=s.p[v];x.fillRect(i*4,y*4,4,4)}}));return c.toDataURL()}const CACHE={};function paint(root=document){root.querySelectorAll('[data-item]').forEach(el=>{const n=el.dataset.item;CACHE[n]??=sprite(n);el.style.backgroundImage=`url(${CACHE[n]})`})}paint();
const stage=document.getElementById('stage'),source=document.getElementById('source'),offhand=document.getElementById('offhand'),cursor=document.getElementById('cursor'),fKey=document.getElementById('f-key'),heldItem=document.getElementById('held-item'),status=document.getElementById('status'),playButton=document.getElementById('play');const sourceInitial=source.innerHTML,offhandInitial=offhand.innerHTML,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));let playing=false,finished=false;
function move(el){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect();cursor.style.left=(b.left-a.left+b.width*.55)+'px';cursor.style.top=(b.top-a.top+b.height*.45)+'px'}
function reset(){source.innerHTML=sourceInitial;offhand.innerHTML=offhandInitial;paint();source.classList.remove('hover','flash');offhand.classList.remove('flash');cursor.classList.remove('show');fKey.classList.remove('held');heldItem.classList.remove('torch');status.className='status';status.textContent='准备就绪，点击画面或播放按钮';playButton.firstElementChild.textContent='\u25b6';playButton.lastElementChild.textContent='播放动画';finished=false}
function flying(el,name){const a=stage.getBoundingClientRect(),b=el.getBoundingClientRect(),f=document.createElement('div');f.className='item flying';f.style.backgroundImage=`url(${CACHE[name]})`;f.style.width=(b.width*.75)+'px';f.style.height=(b.height*.75)+'px';f.style.left=(b.left-a.left+b.width*.125)+'px';f.style.top=(b.top-a.top+b.height*.125)+'px';stage.appendChild(f);return f}
async function play(){if(playing)return;if(finished)reset();playing=true;status.className='status running';status.textContent='光标悬停在 48 个火把上，等待副手快捷键';playButton.lastElementChild.textContent='播放中';move(source);cursor.classList.add('show');source.classList.add('hover');await wait(560);fKey.classList.add('held');status.textContent='F 已按下：交换悬停槽与副手槽';const torch=flying(source,'torch'),shield=flying(offhand,'shield'),a=stage.getBoundingClientRect(),s=source.getBoundingClientRect(),o=offhand.getBoundingClientRect();source.innerHTML='';offhand.innerHTML='<span class="offhand-label">副手</span>';await wait(30);torch.style.left=(o.left-a.left+o.width*.125)+'px';torch.style.top=(o.top-a.top+o.height*.125)+'px';torch.style.transform='rotate(-8deg)';shield.style.left=(s.left-a.left+s.width*.125)+'px';shield.style.top=(s.top-a.top+s.height*.125)+'px';shield.style.transform='rotate(8deg)';await wait(390);source.innerHTML='<div class="item" data-item="shield"></div>';offhand.innerHTML='<div class="item" data-item="torch"></div><span class="count">48</span><span class="offhand-label">副手</span>';paint(source);paint(offhand);torch.remove();shield.remove();source.classList.remove('hover');source.classList.add('flash');offhand.classList.add('flash');heldItem.classList.add('torch');fKey.classList.remove('held');cursor.classList.remove('show');await wait(450);status.className='status done';status.textContent='完成：火把整堆进入副手，盾牌回填到原背包槽';playButton.firstElementChild.textContent='\u21bb';playButton.lastElementChild.textContent='重新播放';playing=false;finished=true}
playButton.addEventListener('click',play);stage.addEventListener('click',play);
if(new URLSearchParams(location.search).get('autoplay')==='1')setTimeout(play,450);
</script>
</body>
</html>
